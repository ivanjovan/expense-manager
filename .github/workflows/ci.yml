name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Dummy values — nothing in this job connects to a real database or
      # calls Auth.js at runtime (prisma generate only reads schema.prisma;
      # it doesn't connect). A Postgres service gets added here once
      # data-access tests land (SRS §20).
      DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
      AUTH_SECRET: "ci-only-secret-not-used-for-anything-real-0000"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test (includes i18n key-parity — see src/i18n/messages.test.ts)
        run: npm run test

      - name: Build
        run: npm run build
